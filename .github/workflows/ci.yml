name: Node package checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    name: Setup / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install project tooling
        run: python -m pip install -e ".[dev]"
      - name: Check dependencies
        run: python -m pip check
      - name: Lint available Python source
        run: python -m ruff check .
      - name: Protocol and state tests (no ComfyUI stubs)
        run: python -m pytest tests/unit -q
      - name: Inspect directory-install archive
        run: python tools/package.py
      - name: Check whitespace
        run: git diff --check

  host:
    name: Real ComfyUI v0.40.0 CPU integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: git clone --depth 1 --branch v0.40.0 https://github.com/Comfy-Org/ComfyUI.git .host
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r .host/requirements.txt -e '.[dev]'
      - name: Test native media, typed connections, list aggregation and cancellation
        run: PYTHONPATH="$PWD/.host:$PWD" python -m pytest tests/host -q
